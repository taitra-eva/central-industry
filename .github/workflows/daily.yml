name: Daily industry news
on:
  # One market-only update immediately after deploying the market updater.
  # This does not run collect, analyze, or full.
  push:
    branches: [main]
    paths:
      - scripts/update_market.py
  schedule:
    - cron: '30 7 * * *'
      timezone: 'Asia/Taipei'
    - cron: '0 8 * * *'
      timezone: 'Asia/Taipei'
    - cron: '20 9,12,16 * * 1-5'
      timezone: 'Asia/Taipei'
  workflow_dispatch:
    inputs:
      stage:
        description: "Choose which stage to run"
        type: choice
        options:
          - collect
          - analyze
          - full
          - market
        default: full
permissions:
  contents: write
concurrency:
  group: daily-industry-news
  cancel-in-progress: false
jobs:
  market:
    if: ${{ github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '20 9,12,16 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.stage == 'market') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market source parser (no AI or news libraries needed)
        run: pip install requests beautifulsoup4
      - name: Validate market parsers offline
        run: python scripts/test_update_market.py
      - name: Update only Bank of Taiwan FX and Brent spot prices
        run: python scripts/update_market.py
      - name: Commit market quotes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          git diff --cached --quiet || (git commit -m 'data: market-only FX and Brent quotes' && git pull --rebase origin main && git push)
  collect:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.stage == 'collect') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate six-sector entity matching before collection
        run: |
          python -m py_compile scripts/industry_entities.py scripts/collect_direct.py scripts/collect_html.py scripts/collect.py scripts/select_daily.py
          python scripts/test_industry_entities.py
          python scripts/test_collect_html.py
      - name: Collect directly from official and specialist publisher RSS
        run: python scripts/collect_direct.py
      - name: Collect dated articles from specialist publisher HTML lists
        run: python scripts/collect_html.py
      - name: Discover relevant articles from ITIS
        run: python scripts/collect_itis_daily.py
        continue-on-error: true
      - name: Limited Google News supplemental discovery (24 vs 126 queries)
        env:
          GOOGLE_NEWS_FALLBACK_MAX: '24'
        run: python scripts/collect.py
      - name: Deduplicate independently verifiable identical headlines before capping
        run: python scripts/dedupe_articles.py
      - name: Select up to eight new stories per sector
        run: python scripts/select_daily.py
      - name: Commit morning collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet || (git commit -m 'chore: morning news collection' && git push)

  analyze:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') || (github.event_name == 'workflow_dispatch' && inputs.stage == 'analyze') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Read free public publisher articles
        run: python scripts/read_articles.py
      - name: Translate titles and verified source excerpts offline
        run: python scripts/translate.py
        continue-on-error: true
      - name: Generate AI summaries from verified full text when free API configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          AI_DAILY_LIMIT: '48'
        run: python scripts/generate_ai_insights.py
      - name: Remove only confirmed same-content duplicates
        run: python scripts/dedupe_articles.py
      - name: Recheck daily sector limits
        run: python scripts/select_daily.py
      - name: Build source-backed industry brief
        run: python scripts/build_brief.py
      - name: Commit analyzed news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet || (git commit -m 'chore: morning article analysis' && git push)

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate six-sector entity matching before collection
        run: |
          python -m py_compile scripts/industry_entities.py scripts/collect_direct.py scripts/collect_html.py scripts/collect.py scripts/select_daily.py
          python scripts/test_industry_entities.py
          python scripts/test_collect_html.py
      - name: Collect directly from official and specialist publisher RSS
        run: python scripts/collect_direct.py
      - name: Collect dated specialist media HTML news
        run: python scripts/collect_html.py
      - name: Discover relevant articles from ITIS
        run: python scripts/collect_itis_daily.py
        continue-on-error: true
      - name: Limited Google News supplemental discovery (24 vs 126 queries)
        env:
          GOOGLE_NEWS_FALLBACK_MAX: '24'
        run: python scripts/collect.py
      - name: Deduplicate independently verifiable identical headlines before capping
        run: python scripts/dedupe_articles.py
      - name: Select eight per industry and ORIGINAL publication day
        run: python scripts/select_daily.py
      - name: Read publisher article contents and resolve links
        run: python scripts/read_articles.py
      - name: Translate available titles and verified excerpts
        run: python scripts/translate.py
        continue-on-error: true
      - name: Generate AI summaries from source bodies if free key is configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          AI_DAILY_LIMIT: '48'
        run: python scripts/generate_ai_insights.py
      - name: Remove only text-confirmed duplicate stories
        run: python scripts/dedupe_articles.py
      - name: Recheck per-day industry limits
        run: python scripts/select_daily.py
      - name: Rebuild brief
        run: python scripts/build_brief.py
      - name: Save updated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet || (git commit -m 'chore: 14-day news catchup and AI test' && git push)
