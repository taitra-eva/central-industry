name: Daily industry news
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # 09:00 local Taipei time; scheduling may be delayed
      timezone: 'Asia/Taipei'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
      - name: Discover relevant articles from ITIS daily news
        run: python scripts/collect_itis_daily.py
        continue-on-error: true
      - name: Read free public original articles
        run: python scripts/read_articles.py
      - name: Translate available titles and publisher excerpts offline
        run: python scripts/translate.py
        continue-on-error: true
      - name: Generate grounded AI summaries from readable originals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          AI_DAILY_LIMIT: '20'
        run: python scripts/generate_ai_insights.py
      - name: Build source-backed industry brief
        run: python scripts/build_brief.py
      - name: Commit refreshed index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet || (git commit -m 'chore: refresh news index' && git push)
