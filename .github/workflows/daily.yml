name: Daily industry news
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # 09:00 local Taipei time; scheduling may be delayed
      timezone: 'Asia/Taipei'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
      - name: Commit refreshed index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/news.json data/archive/
          git diff --cached --quiet || (git commit -m 'chore: refresh news index' && git push)
