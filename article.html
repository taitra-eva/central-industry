<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow"><title>產業新聞內容｜中部產業情報中心</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#372b24;background:#f7f5f2}*{box-sizing:border-box}body{margin:0}.top{background:#fff;padding:19px max(20px,calc((100vw - 900px)/2));color:#68432c;border-bottom:1px solid #e8ded4}.top a{color:#91562f;text-decoration:none;font-weight:650}.wrap{max-width:900px;padding:20px;margin:0 auto}.paper{background:white;border:1px solid #e6ddd6;border-radius:18px;padding:32px;margin:21px 0;box-shadow:0 9px 27px #573c2409}.paper h1{font-size:27px;line-height:1.45;margin:13px 0;color:#3f2d22}.paper h2{font-size:20px;margin:0 0 14px;border-left:4px solid #b3764d;padding-left:12px}.meta{color:#827366;font-size:14px;line-height:1.7}.flag{display:inline-block;background:#f5e9dd;border-radius:6px;padding:5px 8px;margin:4px 6px 4px 0;font-size:13px}.pending{padding:15px;background:#fff8ee;border:1px solid #eed6c2;border-radius:10px;line-height:1.85}a{color:#99531f}hr{border:0;border-top:1px solid #eee5dc;margin:27px 0}.paper p{font-size:15px;line-height:1.9;color:#514338}.footer{color:#827366;font-size:13px;padding:5px 0 30px}@media(max-width:600px){.paper{padding:18px}.paper h1{font-size:22px}}
</style></head><body><header class="top"><a href="./">← 返回中部產業情報中心</a></header><main class="wrap"><div id="detail" class="paper">載入新聞資料中…</div><div class="footer">本站儲存公開新聞索引與經授權／可取得資訊的整理結果；原文章著作權屬發布者所有。</div></main>
<script>
const root=document.getElementById('detail');
function add(parent,tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.appendChild(e);return e}
async function boot(){
const id=new URLSearchParams(location.search).get('id');if(!id){root.textContent='網址缺少新聞識別碼。';return}
try{
const res=await fetch('./data/news.json?v='+Date.now());if(!res.ok)throw new Error('無法讀取新聞資料');
const data=await res.json();const x=(data.items||[]).find(n=>n.id===id);root.replaceChildren();
if(!x){add(root,'h1','找不到這則新聞');add(root,'p','可能已移至歷史資料或識別碼不正確。');return}
add(root,'div',(x.source||'來源未確認')+' · '+(x.published_at?new Date(x.published_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'日期未確認'),'meta');
add(root,'h1',x.title_zh||x.title);
const tags=document.createElement('div');root.appendChild(tags);
const tagValues=[x.region,...(x.industries||[]),x.topic,...(x.tags||[])].filter(Boolean);for(const t of [...new Set(tagValues)])add(tags,'span',t,'flag');
root.appendChild(document.createElement('hr'));
add(root,'h2','中文重點與原文資訊');
if(x.summary_zh&&['verified','source_excerpt_translated'].includes(x.summary_status)){
 add(root,'p',x.summary_zh);
 add(root,'p',x.summary_status==='source_excerpt_translated'?'此段是從實際讀取的來源正文擷取重點段落並翻成中文，尚非生成式 AI 撰寫的完整摘要。':'依取得的原始報導內容整理；公司、數據和事件以原文為準。','meta');
}else if(x.excerpt_translation_zh){
 add(root,'p',x.excerpt_translation_zh);
 add(root,'p','此為來源短文片段的機器翻譯，不代表 AI 已讀完全文，也不等於完整新聞摘要。','meta');
}else{
 add(root,'div',x.access_status==='blocked'?'新聞網站不允許機器讀取全文。':'目前尚未取得足夠的原文內容，無法產生可靠的繁體中文重點整理。','pending');

}
if(x.impact_zh){add(root,'h2','對台灣中部產業的可能影響');add(root,'p',x.impact_zh);add(root,'p','此為分析判斷，並非已證實的訂單或市場變化。','meta');}
root.appendChild(document.createElement('hr'));
add(root,'h2','原文資訊');
add(root,'p','原文標題：'+x.title);
add(root,'p','原始媒體：'+(x.source||'來源未確認'));
const a=add(root,'a','前往原始文章查看完整內容');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';
add(root,'p','本站提供保留重要事實的中文重點整理，原始文章不會未經授權全文轉載。','meta');
}catch(e){root.textContent='載入失敗：'+e.message}
}boot();
</script></body></html>
